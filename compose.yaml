services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneyflow
      POSTGRES_USER: moneyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyflow -d moneyflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://moneyflow:${POSTGRES_PASSWORD}@db:5432/moneyflow?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://moneyflow:${POSTGRES_PASSWORD}@db:5432/moneyflow?schema=public
      NODE_ENV: production
      API_PORT: 4000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build: .
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
    command: ["node", "node_modules/next/dist/bin/next", "start", "apps/web", "--hostname", "0.0.0.0"]
    depends_on: [api]
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  postgres_data:
